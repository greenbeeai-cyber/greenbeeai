<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제출 완료</title>
    <!-- ⭕ 테일윈드가 완벽하게 켜지도록 올바른 CDN 주소로 수정했습니다 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-indigo-100 via-slate-50 to-emerald-100 min-h-screen flex items-center justify-center p-6">

    <!-- 메인 카드 (마우스를 올리면 부드럽게 위로 반응하는 효과 추가) -->
    <div class="bg-white/90 backdrop-blur-lg p-8 md:p-10 rounded-3xl shadow-2xl shadow-slate-200 max-w-sm w-full text-center border border-white transform transition-all duration-3xl hover:-translate-y-1">
        
        <!-- 파스텔톤 입체 체크 아이콘 배경 -->
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-gradient-to-br from-emerald-100 to-teal-50 text-emerald-600 mb-6 shadow-md shadow-emerald-100/50">
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- 메인 타이틀 -->
        <h2 class="text-3xl font-black text-slate-800 tracking-tight mb-2">
            제출 완료 🎉
        </h2>
        
        <!-- 안내 서브 텍스트 -->
        <p class="text-slate-500 font-medium text-sm mb-8 leading-relaxed">
            자소서 작성이 정상적으로 완료되었습니다.<br>데이터가 안전하게 보관되었습니다.
        </p>
        
        <!-- 상태 표시 박스 -->
        <div class="bg-slate-50/80 rounded-2xl p-4 mb-8 border border-slate-100/80">
            <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 block mb-1">Status</span>
            <span class="inline-block bg-gradient-to-r from-indigo-500 to-indigo-600 bg-clip-text text-transparent font-extrabold text-base tracking-wide">
                ㅇㅇㅇ
            </span>
        </div>

        <!-- 원래창으로 돌아가기 버튼 (그라데이션 및 누를 때 반응하는 모션 반영) -->
        <a href="index.html" class="block w-full py-4 bg-gradient-to-r from-indigo-600 to-slate-800 hover:from-indigo-500 hover:to-slate-700 text-white font-bold rounded-2xl shadow-xl shadow-indigo-100 transition-all duration-150 active:scale-[0.98]">
            원래창으로 돌아가기
        </a>
    </div>

</body>
</html>
